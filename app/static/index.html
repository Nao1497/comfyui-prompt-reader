<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI Prompt Reader</title>
<style>
  :root {
    --cell: 160px;
    --left-w: 280px;
    --bg: #1e1f22; --panel: #26272b; --border: #3a3b40; --text: #e6e6e6; --muted: #9a9ba1; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: var(--left-w) 1fr 380px; grid-template-rows: 100vh;
    background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .pane { overflow: auto; min-height: 0; }
  #left { background: var(--panel); border-right: 1px solid var(--border); padding: 12px; }
  #right { background: var(--panel); border-left: 1px solid var(--border); padding: 12px; }
  #center { display: flex; flex-direction: column; }
  #toolbar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #toolbar .muted { color: var(--muted); }
  #cell-size { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #cell-slider { width: 160px; }
  #grid-wrap { flex: 1; overflow: auto; padding: 12px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: 8px; }
  .cell {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    background: #141517; border: 2px solid transparent; border-radius: 4px; cursor: pointer; overflow: hidden; position: relative;
  }
  .cell.selected { border-color: var(--accent); }
  /* FR-39 / AC-27: never enlarge beyond the thumbnail's own resolution. */
  .cell img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
  .cell .badge { position: absolute; left: 4px; top: 4px; font-size: 11px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,.6); color: var(--muted); }
  .cell .fav {
    position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; padding: 0; line-height: 22px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.55);
    color: #ddd; font-size: 15px; text-align: center; cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .cell:hover .fav, .cell .fav.on { opacity: 1; }
  .cell .fav.on { color: #ffcc33; border-color: #ffcc33; }
  .cell .fav:hover { background: rgba(0,0,0,.8); }
  .cell .noimg { color: var(--muted); font-size: 11px; text-align: center; padding: 6px; word-break: break-all; }
  #sentinel { height: 1px; }
  #status { padding: 6px 12px; color: var(--muted); border-top: 1px solid var(--border); }
  /* collapsible sections (left pane) */
  details.sec { border-top: 1px solid var(--border); }
  details.sec:first-of-type { border-top: none; }
  details.sec > summary {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    list-style: none; padding: 10px 0 6px;
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '\25be'; font-size: 10px; line-height: 1; width: 8px; }
  details.sec:not([open]) > summary::before { content: '\25b8'; }
  details.sec > summary:hover { color: var(--text); }
  .sec-count { margin-left: auto; font-size: 11px; text-transform: none; letter-spacing: 0; }
  /* drag handle for the left pane width */
  #left-resizer {
    position: fixed; top: 0; bottom: 0; left: var(--left-w); width: 7px; margin-left: -4px;
    cursor: col-resize; z-index: 20; background: transparent;
  }
  #left-resizer:hover, #left-resizer.dragging { background: var(--accent); opacity: .55; }
  body.resizing { cursor: col-resize; user-select: none; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 6px; }
  .placeholder { color: var(--muted); }
  .muted { color: var(--muted); }
  button { background: #33353b; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #3d3f46; }
  button:disabled { opacity: .5; cursor: default; }
  #scan-btn { width: 100%; }
  #scan-result { margin-top: 6px; font-size: 12px; white-space: pre-line; }
  ul.tree { list-style: none; margin: 0; padding: 0; }
  ul.tree ul { list-style: none; margin: 0; padding-left: 14px; }
  .item { display: flex; justify-content: space-between; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .item:hover { background: #33353b; }
  .item.selected { background: var(--accent); color: #fff; }
  .item .label { overflow: hidden; text-overflow: ellipsis; }
  .item .count { color: var(--muted); font-size: 11px; }
  .item.selected .count { color: #e8f0ff; }
  /* right pane */
  #preview { width: 100%; background: #141517; border-radius: 4px; display: flex; justify-content: center; margin-bottom: 8px; }
  #preview img { max-width: 100%; max-height: 320px; width: auto; height: auto; display: block; }
  #preview .noimg { padding: 24px; }
  .detail-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .detail-head .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fav-btn.on { color: #ffcc33; border-color: #ffcc33; }
  table.kv { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  table.kv th { text-align: left; color: var(--muted); font-weight: normal; width: 34%; padding: 2px 6px 2px 0; vertical-align: top; }
  table.kv td { padding: 2px 0; word-break: break-all; }
  .notice { background: #3a3320; border: 1px solid #6b5a1e; color: #f0d78c; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
  .notice a { color: #ffd966; }
  .prompt-block { margin-bottom: 10px; }
  .prompt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .prompt-head .title { color: var(--muted); }
  pre.prompt { margin: 0; padding: 8px; background: #141517; border: 1px solid var(--border); border-radius: 4px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 240px; overflow: auto; }
  pre.prompt.empty { color: var(--muted); font-style: italic; }
  .copied { color: #7fd48a; font-size: 11px; margin-left: 6px; }
  a { color: var(--accent); }
  /* tags */
  #tag-import-btn { width: 100%; margin-bottom: 4px; }
  #tag-import-result { font-size: 12px; white-space: pre-line; margin-bottom: 4px; }
  #tag-search { width: 100%; box-sizing: border-box; background: #141517; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 6px; margin: 4px 0; font: inherit; }
  #tag-used-head { margin-top: 6px; font-size: 11px; }
  .tag-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; background: var(--tagc, #888); }
  .item .post { color: var(--muted); font-size: 10px; margin-left: 4px; flex: none; }
  #tag-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #tag-bar select { background: #33353b; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font: inherit; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--tagc, var(--border)); background: color-mix(in srgb, var(--tagc, #888) 18%, transparent); font-size: 12px; cursor: default; }
  .chip .x { cursor: pointer; color: var(--muted); }
  .chip .x:hover { color: var(--text); }
  .chip.unknown { border-style: dashed; color: var(--muted); }
  .chip.clickable { cursor: pointer; }
  .chip.on { outline: 2px solid var(--accent); }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip .sub { color: var(--muted); font-size: 10px; }
  .chip a { color: inherit; font-size: 10px; }
  /* LoRA */
  #lora-scan-btn { width: 100%; margin-bottom: 4px; }
  #lora-scan-result { font-size: 12px; white-space: pre-line; margin-bottom: 4px; }
  .item .presence { font-size: 10px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); margin-left: auto; flex: none; }
  .item .label { flex: 1; }
  .item .presence.missing { color: #f08a8a; border-color: #7a3a3a; }
  .item .presence.unknown { color: #d7b45a; border-color: #6b5a1e; }
  .lora-editor label { display: block; color: var(--muted); margin: 8px 0 4px; }
  .lora-editor textarea { width: 100%; min-height: 64px; background: #141517; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
  .lora-editor .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .lora-editor .saved { color: #7fd48a; font-size: 11px; }
  ul.lora-usage { list-style: none; margin: 0 0 8px; padding: 0; }
  ul.lora-usage li { padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 4px; }
  ul.lora-usage .lora-name { cursor: pointer; color: var(--accent); }
  ul.lora-usage .strength { color: var(--muted); font-size: 11px; margin-left: 6px; }
  ul.lora-usage .trigger { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
</style>
</head>
<body>
  <aside id="left" class="pane">
    <button id="scan-btn" type="button">スキャン実行</button>
    <div id="scan-result" class="muted"></div>

    <details class="sec" data-sec="view" open>
      <summary>表示</summary>
      <ul id="fixed-items" class="tree">
        <li class="item selected" data-kind="all"><span class="label">すべて</span><span class="count" data-count="all"></span></li>
        <li class="item" data-kind="favorite"><span class="label">お気に入り</span><span class="count" data-count="favorite"></span></li>
        <li class="item" data-kind="missing"><span class="label">見つからない</span><span class="count" data-count="missing"></span></li>
      </ul>
    </details>

    <details class="sec" data-sec="folders" open>
      <summary>フォルダ<span class="sec-count" id="count-folders"></span></summary>
      <label class="muted"><input type="checkbox" id="recursive" checked> サブフォルダを含む</label>
      <ul id="folder-tree" class="tree"></ul>
    </details>

    <details class="sec" data-sec="lora" open>
      <summary>LoRA<span class="sec-count" id="count-lora"></span></summary>
      <button id="lora-scan-btn" type="button">LoRA スキャン</button>
      <div id="lora-scan-result" class="muted"></div>
      <ul id="lora-list" class="tree"></ul>
    </details>

    <details class="sec" data-sec="tags" open>
      <summary>タグ<span class="sec-count" id="count-tags"></span></summary>
      <input type="file" id="tag-csv" accept=".csv,text/csv" hidden>
      <button id="tag-import-btn" type="button">タグ CSV を取り込む</button>
      <div id="tag-import-result" class="muted"></div>
      <input id="tag-search" type="search" placeholder="辞書を検索（全列）" autocomplete="off">
      <ul id="tag-search-results" class="tree"></ul>
      <div id="tag-used-head" class="muted">使用中のタグ</div>
      <ul id="tag-used" class="tree"></ul>
    </details>
  </aside>

  <div id="left-resizer" title="ドラッグで幅を変更／ダブルクリックで既定に戻す"></div>

  <main id="center" class="pane">
    <div id="toolbar">
      <span id="filter-label">すべて</span>
      <span id="total" class="muted"></span>
      <label id="cell-size" title="サムネイル表示サイズ">
        <span class="muted">サイズ</span>
        <input id="cell-slider" type="range" min="96" max="320" step="8" value="160">
        <span id="cell-value" class="muted">160px</span>
      </label>
    </div>
    <div id="tag-bar" hidden>
      <span class="muted">タグ:</span>
      <span id="tag-chips"></span>
      <label class="muted" title="複数タグの扱い">
        <select id="tag-match">
          <option value="and">すべて含む</option>
          <option value="or">いずれかを含む</option>
        </select>
      </label>
      <button id="tag-clear" type="button">解除</button>
    </div>
    <div id="grid-wrap">
      <div id="grid"></div>
      <div id="sentinel"></div>
    </div>
    <div id="status"></div>
  </main>

  <aside id="right" class="pane">
    <h2>詳細</h2>
    <div id="detail" class="placeholder">画像を選択してください</div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
