[project]
name = "comfyui-prompt-reader"
version = "0.1.0"
description = "Browse locally stored ComfyUI images and their embedded generation metadata"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
